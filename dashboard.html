<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Timestamp Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111827;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .box {
      background: #1f2937;
      padding: 30px;
      border-radius: 16px;
      width: min(700px, 90vw);
    }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      font-size: 18px;
      border-radius: 10px;
      margin-bottom: 10px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
    }
    .result {
      margin-top: 20px;
      background: #0f172a;
      padding: 14px;
      border-radius: 10px;
      display: none;
    }
    .result.show { display: block; }
    .label {
      color: #94a3b8;
      font-size: 12px;
      text-transform: uppercase;
      margin-top: 12px;
    }
    .value {
      word-break: break-all;
      font-family: monospace;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Discord Timestamp Generator</h1>

    <input id="dateInput" type="text" placeholder="25/12/24/14:30" />

    <button id="generateBtn">Generate</button>

    <div id="result" class="result">
      <div class="label">Entered Date</div>
      <div class="value" id="enteredDate"></div>

      <div class="label">Actual Date</div>
      <div class="value" id="actualDate"></div>

      <div class="label">Unix Timestamp</div>
      <div class="value" id="timestamp"></div>

      <div class="label">Discord Full</div>
      <div class="value" id="discordFull"></div>

      <div class="label">Discord Date</div>
      <div class="value" id="discordDate"></div>

      <div class="label">Discord Time</div>
      <div class="value" id="discordTime"></div>

      <div class="label">Discord Relative</div>
      <div class="value" id="discordRelative"></div>
    </div>
  </div>

  <script>
    document.getElementById("generateBtn").addEventListener("click", async () => {
      const value = document.getElementById("dateInput").value.trim();
      const result = document.getElementById("result");

      const response = await fetch(
        `https://discord2-0-d7bs.onrender.com/timestamp?date=${encodeURIComponent(value)}`
      );

      const data = await response.json();

      document.getElementById("enteredDate").textContent = data.entered_date;
      document.getElementById("actualDate").textContent = data.actual_date;
      document.getElementById("timestamp").textContent = data.timestamp;
      document.getElementById("discordFull").textContent = data.discord.full;
      document.getElementById("discordDate").textContent = data.discord.date;
      document.getElementById("discordTime").textContent = data.discord.time;
      document.getElementById("discordRelative").textContent = data.discord.relative;

      result.classList.add("show");
    });
  </script>
</body>
</html>
